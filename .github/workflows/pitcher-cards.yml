name: Build pitcher cards

# Cards for every pitcher in every finished game with Statcast tracking (MLB, Triple-A, the
# Florida State League's Hawk-Eye parks, the Arizona Fall League, ...), written to the bucket
# (cards/<level>/) by
# tools/pitcher_card/build_site.py; nothing is committed. The nightly run does yesterday
# and today. A backfill splits its range into months and builds them in parallel, each
# job checkpointing its day manifests in the bucket, and the index is rebuilt from the
# manifests once every job has finished. Then the season cards (tools/pitcher_card/season.py,
# cards/mlb/seasons/) are pooled from this season's game cards, when they have moved. A past
# season's season cards (past_seasons) are pooled from game cards built for them alone: its
# months are built as parallel jobs into a folder, without comparison seasons, and kept in the
# bucket's archive (cards/mlb/archive/), which the Game Cards page doesn't list.
on:
  schedule:
    # 10:30 UTC is 6:30am Eastern: every game from the night before is final
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First date to build (YYYY-MM-DD). Default: yesterday."
        required: false
      end:
        description: "Last date to build (YYYY-MM-DD). Default: today."
        required: false
      levels:
        description: "Levels to build, as sport codes (e.g. mlb,aaa,afx). Default: every tracked level."
        required: false
        default: "all"
      force:
        description: "Rebuild cards already built (after a change to the data or the models)"
        type: boolean
        default: false
      all_packs:
        description: "Rebuild every pitcher's pack of comparison seasons, not just the recent ones"
        type: boolean
        default: false
      past_seasons:
        description: "Season cards for past seasons, e.g. 2023 or 2020-2025: builds their game cards first (instead of the dates above)"
        required: false
      prune_pages:
        description: "Old per-card pages (from before the cards were data): report what becomes of them, or apply it"
        type: choice
        options: ["no", "report", "apply"]
        default: "no"

concurrency:
  group: pitcher-cards
  cancel-in-progress: false

env:
  R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  # the range as month-sized chunks, so a season backfill runs as parallel jobs
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.split.outputs.chunks }}
      past: ${{ steps.split.outputs.past }}
    steps:
      - id: split
        shell: python
        run: |
          import datetime as dt, json, os, urllib.request

          def months(start, end, past=""):
              chunks, d = [], start
              while d <= end:
                  last = min(end, (d.replace(day=28) + dt.timedelta(days=4)).replace(day=1) - dt.timedelta(days=1))
                  chunks.append({"start": d.isoformat(), "end": last.isoformat(), "past": past})
                  d = last + dt.timedelta(days=1)
              return chunks

          # past seasons: each one's regular season, as MLB dates it
          lo, _, hi = "${{ inputs.past_seasons }}".strip().partition("-")
          years = list(range(int(lo), int(hi or lo) + 1)) if lo else []
          chunks = []
          for year in years:
              url = f"https://statsapi.mlb.com/api/v1/seasons/{year}?sportId=1"
              se = json.load(urllib.request.urlopen(url, timeout=30))["seasons"][0]
              chunks += months(dt.date.fromisoformat(se["regularSeasonStartDate"]),
                               dt.date.fromisoformat(se["regularSeasonEndDate"]), str(year))
          if not years:
              today = dt.date.today()
              start = dt.date.fromisoformat("${{ inputs.start }}" or (today - dt.timedelta(days=1)).isoformat())
              end = dt.date.fromisoformat("${{ inputs.end }}" or today.isoformat())
              chunks = months(start, end)
          print(chunks)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("chunks=" + json.dumps(chunks) + "\n")
              fh.write("past=" + " ".join(map(str, years)) + "\n")

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      # a past season's months build into folders, so more of them can run at once
      max-parallel: ${{ inputs.past_seasons && 8 || 4 }}
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    name: build ${{ matrix.chunk.start }} to ${{ matrix.chunk.end }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pitcher_card/requirements.txt

      - name: Fetch the scraper and the models
        run: |
          git clone --depth 1 https://github.com/Blandalytics/statcast_scraper.git
          git clone --depth 1 https://github.com/Blandalytics/player_cards.git

      - name: Install
        run: pip install -r tools/pitcher_card/requirements.txt

      # the data files behind the comparison seasons, narrowed and cached; only the first
      # job of a run saves a copy, so a backfill's parallel jobs don't churn it
      - name: Restore the data cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: tools/pitcher_card/cache
          key: pitcher-seasons-${{ github.run_id }}
          restore-keys: pitcher-seasons-

      - name: Build
        if: ${{ !matrix.chunk.past }}
        run: |
          ARGS="--start ${{ matrix.chunk.start }} --end ${{ matrix.chunk.end }} --levels ${{ inputs.levels || 'all' }}"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python tools/pitcher_card/build_site.py $ARGS

      # a past season's game cards, for its season cards alone: into a folder rather than the
      # Game Cards page, without comparison seasons (none is as early as the first), and then
      # into the archive the season cards are pooled from
      - name: Build a past season's game cards
        if: ${{ matrix.chunk.past }}
        run: |
          OUT="$RUNNER_TEMP/past"
          python tools/pitcher_card/build_site.py --out "$OUT" --levels mlb \
            --start ${{ matrix.chunk.start }} --end ${{ matrix.chunk.end }} \
            --first-season $(( ${{ matrix.chunk.past }} + 1 ))
          python tools/pitcher_card/season.py --archive "$OUT"

      - name: Save the data cache
        if: strategy.job-index == 0
        uses: actions/cache/save@v4
        with:
          path: tools/pitcher_card/cache
          key: pitcher-seasons-${{ github.run_id }}

  # the index is rebuilt from every day manifest, so it is right however the jobs ended
  reindex:
    needs: build
    if: ${{ !cancelled() && !inputs.past_seasons }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pitcher_card/requirements.txt

      - name: Fetch the scraper and the models
        run: |
          git clone --depth 1 https://github.com/Blandalytics/statcast_scraper.git
          git clone --depth 1 https://github.com/Blandalytics/player_cards.git

      - name: Install
        run: pip install -r tools/pitcher_card/requirements.txt

      - name: Reindex
        run: python tools/pitcher_card/build_site.py --reindex

      # a page whose card is listed becomes a redirect to the card's view; the rest go
      - name: Retire the old per-card pages
        if: ${{ inputs.prune_pages == 'report' || inputs.prune_pages == 'apply' }}
        run: python tools/pitcher_card/build_site.py --prune-pages ${{ inputs.prune_pages == 'apply' && '--apply' || '' }}

  # what the live Worker builds its cards from: each pitcher's pack of comparison seasons,
  # the season's arm angles, and the scorer bundle (the pitch models, which the Worker
  # runs in a JS port). The bundle is checked against this pipeline on yesterday's games
  # before it is published, so a model or code change that the port doesn't match stops
  # here, with the Worker still on the last good bundle.
  live-inputs:
    needs: build
    if: ${{ !cancelled() && !inputs.past_seasons }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pitcher_card/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch the scraper and the models
        run: |
          git clone --depth 1 https://github.com/Blandalytics/statcast_scraper.git
          git clone --depth 1 https://github.com/Blandalytics/player_cards.git

      - name: Install
        run: pip install -r tools/pitcher_card/requirements.txt

      - name: Restore the data cache
        uses: actions/cache/restore@v4
        with:
          path: tools/pitcher_card/cache
          key: pitcher-seasons-${{ github.run_id }}
          restore-keys: pitcher-seasons-

      - name: Pitcher packs and arm angles
        run: |
          ARGS=""
          if [ "${{ inputs.all_packs }}" = "true" ]; then ARGS="--all"; fi
          python tools/pitcher_card/packs.py $ARGS

      - name: Check the Worker's port against yesterday's games
        run: |
          python tools/pitcher_card/parity.py "$RUNNER_TEMP/parity"
          node tools/live/test/card_parity.mjs "$RUNNER_TEMP/parity"

      - name: Publish the scorer bundle
        run: python tools/pitcher_card/export_scorer.py

  # the season cards: each past season's asked for, from its archived game cards; and this
  # season's, pooled again when its game cards have moved (or with force)
  season-cards:
    needs: [plan, build, reindex]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pitcher_card/requirements.txt

      - name: Fetch the scraper
        run: git clone --depth 1 https://github.com/Blandalytics/statcast_scraper.git

      - name: Install
        run: pip install -r tools/pitcher_card/requirements.txt

      - name: Season cards
        run: |
          for YEAR in ${{ needs.plan.outputs.past }}; do
            python tools/pitcher_card/season.py --year "$YEAR" --publish --force
          done
          python tools/pitcher_card/season.py --publish ${{ inputs.force && '--force' || '' }}
