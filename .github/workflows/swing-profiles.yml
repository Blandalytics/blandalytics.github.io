name: Build swing profile distributions

on:
  schedule:
    # 11:00 UTC, after the scorecards and pitcher cards; the leaderboard has the previous night's games
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to build, space-separated (e.g. 2024 2025 2026). Default: the latest with data."
        required: false

# the job commits the generated data back to the repo
permissions:
  contents: write

concurrency:
  group: swing-profiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/swing_profiles/requirements.txt

      - name: Fetch the pipeline
        run: git clone --depth 1 https://github.com/Blandalytics/swing_profiles.git

      - name: Install
        run: pip install -r tools/swing_profiles/requirements.txt

      - name: Build
        run: python tools/swing_profiles/build_data.py --quiet ${{ inputs.seasons && format('--seasons {0}', inputs.seasons) || '' }}

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add swing-profiles/data
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Swing profiles: $(date -u +%Y-%m-%d)"
            git push
          fi
