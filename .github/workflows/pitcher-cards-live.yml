name: Live pitcher cards

# Cards for the MLB games in progress, written to the bucket (live/cards/) rather than
# the repo, every 15 minutes through game hours. A pitcher's card is rebuilt only when
# his pitch count has moved; a game gets one last build after it goes final, and the
# nightly pitcher-cards run then commits the permanent card.
on:
  schedule:
    - cron: "*/15 16-23,0-6 * * *"
  workflow_dispatch:
    inputs:
      game:
        description: "One gamePk to build, whatever its state (default: every live game)"
        required: false

concurrency:
  group: pitcher-cards-live
  cancel-in-progress: false

jobs:
  # a cheap look before the full setup: is anything on, waiting for its final build, or
  # left in the index now that its permanent cards exist?
  check:
    runs-on: ubuntu-latest
    outputs:
      live: ${{ steps.q.outputs.live }}
    steps:
      - id: q
        shell: python
        run: |
          import json, os, urllib.request

          def load(url):
              # the bucket is behind Cloudflare, which turns away urllib's own agent
              req = urllib.request.Request(url, headers={"User-Agent": "blandalytics-site"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return json.load(r)
              except Exception as exc:          # noqa: BLE001 - a miss just means "nothing"
                  print(f"{url}: {exc}")
                  return {}

          BASE = "https://data.blandalytics.com"
          today = load(f"{BASE}/live/today.json").get("games", [])
          index = load(f"{BASE}/live/cards/index.json").get("games", {})
          built = set(load(f"{BASE}/cards/index.json").get("games", {}))
          live = sum(1 for g in today
                     if g["sport"]["id"] == 1 and g["status"]["abstract"] == "Live")
          pending = sum(1 for g in index.values() if not g.get("final"))
          superseded = len(set(index) & built)
          print(f"{live} live, {pending} awaiting a final build, {superseded} superseded")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"live={'true' if live or pending or superseded else 'false'}\n")

  build:
    needs: check
    if: needs.check.outputs.live == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/pitcher_card/requirements.txt

      - name: Fetch the scraper and the models
        run: |
          git clone --depth 1 https://github.com/Blandalytics/statcast_scraper.git
          git clone --depth 1 https://github.com/Blandalytics/player_cards.git

      - name: Install
        run: pip install -r tools/pitcher_card/requirements.txt

      # the same comparison-season cache the nightly build keeps; this job only saves
      # one when there was none to restore, so a run every 15 minutes doesn't churn it
      - name: Restore the season cache
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: tools/pitcher_card/cache
          key: pitcher-seasons-${{ github.run_id }}
          restore-keys: pitcher-seasons-

      - name: Build
        run: |
          ARGS=""
          [ -n "${{ inputs.game }}" ] && ARGS="--game ${{ inputs.game }}"
          python tools/pitcher_card/live_cards.py $ARGS

      - name: Save the season cache
        if: steps.restore.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: tools/pitcher_card/cache
          key: pitcher-seasons-${{ github.run_id }}
