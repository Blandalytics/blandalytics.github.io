name: Build scorecards

on:
  schedule:
    # 10:00 UTC is 6am Eastern / 3am Pacific: every game from the night before is final
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      start:
        description: "First date to build (YYYY-MM-DD). Default: yesterday."
        required: false
      end:
        description: "Last date to build (YYYY-MM-DD). Default: today."
        required: false
      force:
        description: "Re-render games already built (after a rendering change)"
        type: boolean
        default: false

# the job commits the generated pages back to the repo
permissions:
  contents: write

concurrency:
  group: scorecards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/scorecard/requirements.txt

      - name: Fetch the scraper
        run: git clone --depth 1 https://github.com/Blandalytics/statcast_scraper.git

      - name: Install
        run: pip install -r tools/scorecard/requirements.txt

      - name: Build
        run: |
          ARGS=""
          [ -n "${{ inputs.start }}" ] && ARGS="$ARGS --start ${{ inputs.start }}"
          [ -n "${{ inputs.end }}" ]   && ARGS="$ARGS --end ${{ inputs.end }}"
          [ "${{ inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python tools/scorecard/build_site.py --out scorecards $ARGS

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scorecards
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "Scorecards: $(date -u +%Y-%m-%d)"
            git push
          fi
