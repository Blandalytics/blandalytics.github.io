name: Build xMiss data

# The xMiss page's data (tools/xmiss/build.py): every pitcher's miss ellipses for every level and
# season in the bucket's pitch data (data/), scored with the xMiss model (a file in the bucket,
# pinned by hash in build.py), written back to the bucket under xmiss/. Only level-seasons whose
# source files changed are rebuilt, so in season that is the current season at each level.
on:
  schedule:
    # 11:45 UTC: after the data files roll at 10:30, so the season holds the day that has
    # just settled
    - cron: "45 11 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Level-seasons to consider, comma-separated (e.g. mlb/2026,aaa/2026). Default: all."
        required: false
      force:
        description: "Rebuild them even if their source files haven't changed (after a model change)"
        type: boolean
        default: false

concurrency:
  group: xmiss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/xmiss/requirements.txt

      - name: Install
        run: pip install -r tools/xmiss/requirements.txt

      # last season's file is the current season's history: keep the downloads between runs
      - name: Restore the data cache
        uses: actions/cache/restore@v4
        with:
          path: tools/xmiss/cache
          key: xmiss-data-${{ github.run_id }}
          restore-keys: xmiss-data-

      - name: Build
        run: >-
          python tools/xmiss/build.py
          ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
          ${{ inputs.force && '--force' || '' }}

      - name: Save the data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/xmiss/cache
          key: xmiss-data-${{ github.run_id }}
