name: Build batted-ball data

# The Batted Ball Charts page's data (tools/batted_balls/build_data.py): every
# hitter's batted balls and the league density for a season, from the completed-
# games Parquet in the bucket, written back to the bucket under batted-balls/. From
# 2024 each ball also gets its bat speed, pulled from Baseball Savant a week at a
# time (tools/xwoba/savant.py), and its xwOBA from the model in tools/xwoba.
on:
  schedule:
    # 11:15 UTC: after the data files roll at 10:30, so the season file holds the
    # day that has just settled
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      seasons:
        description: "Seasons to build, space-separated (e.g. 2021 2022 2023). Default: the current one."
        required: false

concurrency:
  group: batted-balls
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/batted_balls/requirements.txt

      - name: Install
        run: pip install -r tools/batted_balls/requirements.txt

      # Savant's settled weeks, so a run asks only for the days since the last one.
      # Saved after every run: the season grows by a week at a time.
      - name: Restore the Savant cache
        uses: actions/cache/restore@v4
        with:
          path: tools/xwoba/cache
          key: savant-weeks-${{ github.run_id }}
          restore-keys: savant-weeks-

      - name: Build
        run: python tools/batted_balls/build_data.py ${{ inputs.seasons && format('--seasons {0}', inputs.seasons) || '' }}

      - name: Save the Savant cache
        uses: actions/cache/save@v4
        with:
          path: tools/xwoba/cache
          key: savant-weeks-${{ github.run_id }}
