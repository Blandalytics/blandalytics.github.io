<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PLV Pitcher Game Card</title>
<link rel="icon" href="https://res.cloudinary.com/dduabusaf/image/upload/v1772839606/teal_letter_logo_owufaj.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Work+Sans:wght@400;500&display=swap">
<link rel="stylesheet" href="/shared/plpd.css?v=3">
<style>
/* one card, full size, on its own card-card-bg (the PLPD system's #292C42); the Share image button
   floats over it as a PLPD standard button on a surface-3 fill */
html,body{margin:0}
body.plpd{background:var(--card-card-bg); color:var(--text-text-nav); display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh}
#card{width:100%; max-width:1500px}
#prov{margin:6px 0 10px; padding:0 20px; font-size:13px; text-align:center}
#prov b{font-family:var(--font-display); color:var(--text-text-cell); font-weight:600}
#prov[hidden]{display:none}
#card svg{display:block; width:100%; height:auto}
#msg{align-self:center; padding:0 20px; text-align:center}
#msg[hidden],#card[hidden]{display:none}
#png{position:fixed; right:14px; bottom:14px; background:var(--surfaces-surface-3); box-shadow:inset 0 0 0 1px var(--borders-border-tab),0 6px 20px 0 rgba(0,0,0,.36)}
#png:hover{background:linear-gradient(var(--white-alpha-200),var(--white-alpha-200)),var(--surfaces-surface-3)}
#png[hidden]{display:none}
</style>
</head>
<body class="plpd">
<div id="card" hidden></div>
<p id="prov" hidden><b>PLV and Location are provisional below MLB</b> (the models aren't yet calibrated to minor-league strike zones and parks).</p>
<p id="msg">Loading the card…</p>
<button id="png" class="plpd-btn" type="button" hidden>Share image ▾</button>
<script src="/shared/share-image.js?v=2"></script>
<script src="card.js?v=22"></script>
<script>
// One card, full size: card.html#<gamePk>-<pitcherId>, optionally &cmp=<year> (0 for no
// comparison). The card comes from the day's data file, found through the index, or from
// the live cards while its game is on; ?index= and ?live= point elsewhere, as on the picker.
(function () {
  var params = new URLSearchParams(location.search);
  var INDEX = new URL(params.get('index') || 'https://data.blandalytics.com/cards/index.json', location.href).href;
  var LIVE = new URL(params.get('live') || 'https://data.blandalytics.com/live/cards/index.json', location.href).href;
  var el = document.getElementById('card'), msg = document.getElementById('msg');
  var btn = document.getElementById('png');
  var svg = null, card = null;

  function getJson(url) {
    return fetch(url, {cache: 'no-cache'}).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function parse() {
    var m = /^#(\d+)-(\d+)(?:&cmp=(-?\d+))?$/.exec(location.hash);
    return m ? {pk: m[1], pid: m[2], cmp: m[3]} : null;
  }
  // a game the nightly build has written is in its level's day's data (level_games: an index
  // from before the levels has MLB's games alone, at data/); one in progress, in the live
  // index with a file of its own
  function find(want) {
    var key = want.pk + '-' + want.pid;
    return getJson(INDEX).then(function (index) {
      var at = (index.level_games || {})[want.pk];
      var path = at ? at[0] + '/data/' + at[1] : index.games && index.games[want.pk] ? 'data/' + index.games[want.pk] : null;
      if (path) return getJson(new URL(path + '.json', INDEX).href).then(function (d) { return d[key]; });
      return getJson(LIVE).then(function (live) {
        var g = (live.games || {})[want.pk];
        var p = g && g.pitchers.filter(function (x) { return String(x.id) === want.pid; })[0];
        return p && getJson(new URL(p.file, LIVE).href + '?v=' + p.pitches);
      });
    });
  }
  function show() {
    var want = parse();
    if (!want) { msg.textContent = 'No card named: link to card.html#<gamePk>-<pitcherId>.'; return; }
    find(want).then(function (c) {
      if (!c) throw new Error('missing');
      card = c;
      svg = PitcherCard.draw(el, card, {logo: 'PitcherList_Stats_watermark_with_logo.webp'});
      PitcherCard.show(svg, PitcherCard.comparisonYear(card, want.cmp === undefined ? null : +want.cmp));
      document.title = card.name + ' — ' + card.date + ' ' + (card.home ? 'vs' : '@') + ' ' + card.opp
        + ' — PLV Pitcher Game Card';
      el.hidden = false; msg.hidden = true; btn.hidden = false;
      document.getElementById('prov').hidden = !(card.provisional && card.provisional.length);
    }).catch(function () { msg.textContent = 'Could not find that card.'; });
  }
  // Share image (shared/share-image.js): the card at 3000 x 4000, to copy or download
  ShareImage.image(btn, function () {
    if (!svg) throw new Error('no card');
    return PitcherCard.png(svg);
  }, function () { return PitcherCard.filename(card); });
  window.addEventListener('hashchange', show);
  show();
})();
</script>
</body>
</html>
