<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>PLV Pitcher Season Card</title>
<meta name="description" content="A Pitcher List Stats card for every MLB pitcher's regular season since 2020: Stuff, Location and PLV grades, with movement, locations, and usage.">
<link rel="icon" href="https://res.cloudinary.com/dduabusaf/image/upload/v1772839606/teal_letter_logo_owufaj.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,900&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/shared/plpd.css?v=3">
<style>
/* the Game Cards picker (index.html) for whole seasons: a surface-2 bar of PLPD fields over the
   season's grades table and the card, which keeps its own card-bg (#292C42) */
*{box-sizing:border-box}
html,body{height:100%}
body.plpd{display:flex; flex-direction:column}

/* ---------- picker bar ---------- */
.bar{
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:var(--space-300) var(--space-400);
  padding:16px var(--layout-page-content-gutter); border-bottom:1px solid var(--surface-border-card); background:var(--surfaces-surface-2);
}
.brand{margin-right:auto; display:flex; align-items:center; gap:var(--space-300); align-self:center}
.brand img{height:34px; width:auto}
.brand div{display:flex; flex-direction:column; gap:2px}
.brand h1{margin:0; font-family:var(--font-display); font-size:24px; font-weight:900; line-height:1.2; color:var(--brand-brand-cyan)}
.brand .sub{font-family:var(--font-display); font-size:12px; line-height:1.25; letter-spacing:.36px; color:var(--text-text-zero); font-variant-numeric:tabular-nums}
.field select.plpd-filter-dropdown{width:auto; min-width:110px; font-variant-numeric:tabular-nums}
#pitcherQ{width:224px}  /* the Level, Season, threshold, split and Share image beside it on one row at 1600px */
/* the Pitcher box's suggestions: Model Drilldown's list, ten rows tall before it scrolls */
.suggest-list{--rows:10; max-height:calc(var(--rows) * 34px + 14px); overflow-y:auto; overscroll-behavior:contain;
  scrollbar-width:thin; scrollbar-color:var(--navy-500) transparent}
.suggest-list li span{white-space:nowrap} /* the name on one line; the hand and team give way */
.suggest-list li small{min-width:0; overflow:hidden; text-overflow:ellipsis}
/* the pitch threshold, set as the dropdowns are (the system has no number field) */
.field input.num{box-sizing:border-box; height:40px; width:110px; padding:0 12px; border:1px solid var(--borders-border-tab);
  border-radius:var(--radius-lg); background:var(--surfaces-surface-3); box-shadow:var(--shadow-pl-filter-search-input-inset);
  font-family:var(--font-text); font-size:14px; font-weight:500; line-height:1.2; color:var(--text-text-cell); font-variant-numeric:tabular-nums}
.field input.num:hover{background-color:#262940}
.field input.num:focus-visible{outline:2px solid var(--brand-brand-cyan); outline-offset:2px}
.btn[hidden]{display:none}

/* ---------- the season's grades: every card the Pitcher list offers ---------- */
.grades{flex:none; padding:var(--space-300) var(--layout-page-content-gutter) 0}
.grades[hidden]{display:none}
.grades summary{cursor:pointer; width:max-content; padding:2px 0 8px; font-family:var(--font-display); font-size:14px;
  font-weight:600; line-height:20px; color:var(--text-text-cell)}
.grades summary .n{color:var(--text-text-nav); font-weight:500}
.grades .plpd-table-wrap{max-height:min(34vh, 380px)}
#gradesTable{width:100%}
#gradesTable th,#gradesTable td{padding:6px 10px; text-align:center}
#gradesTable thead th{position:sticky; top:0; z-index:2; font-size:13px}
#gradesTable thead tr.group th{height:26px; padding-block:4px; color:var(--text-text-nav); font-weight:500}
#gradesTable thead tr.cols th{top:26px}
#gradesTable th button{all:unset; cursor:pointer}
#gradesTable th button:focus-visible{outline:2px solid var(--brand-brand-cyan); outline-offset:2px}
#gradesTable thead th:hover{color:var(--data-table-pl-data-table-cell-text)}
#gradesTable td{font-size:14px; background:var(--data-table-pl-data-table-scroll-base-bg)}
#gradesTable .who{position:sticky; left:0; z-index:1; text-align:left}
#gradesTable thead .who{z-index:3}
#gradesTable td.who{max-width:300px; overflow:hidden; text-overflow:ellipsis}
#gradesTable td.who a{color:var(--brand-brand-cyan); text-decoration:none; font-family:var(--font-display); font-weight:600}
#gradesTable td.who a:hover,#gradesTable td.who a:focus-visible{text-decoration:underline}
#gradesTable td.who .meta{margin-left:8px; color:var(--text-text-nav); font-size:13px}
#gradesTable td.g{font-family:var(--font-display); font-weight:700}
#gradesTable td.n{font-variant-numeric:tabular-nums}
#gradesTable .first{border-left:1px solid var(--data-table-pl-data-table-header-border)}
#gradesTable tbody tr[data-key]{cursor:pointer} /* the whole row opens its card */
#gradesTable tbody tr:hover td{background:var(--data-table-pl-data-table-row-hover-bg)}
#gradesTable tbody tr.on td{background:var(--data-table-pl-data-table-row-open-bg)}
#gradesTable tbody tr:last-child td{border-bottom:0}

/* ---------- the table and the card: laid out as on the Game Cards page ---------- */
.split{flex:1; min-height:0; display:flex; flex-direction:column}
@media (min-width:761px){
  .split:has(.grades:not([hidden]) #gradesBox[open]){container-type:size; min-height:520px}
}
@media (min-width:761px) and (orientation:landscape){
  .split:has(.grades:not([hidden]) #gradesBox[open]){flex-direction:row}
  .split:has(.grades:not([hidden]) #gradesBox[open]) .grades{flex:1 1 0; min-width:0;
    padding:var(--space-300) var(--space-300) var(--space-300) var(--layout-page-content-gutter)}
  .split:has(.grades:not([hidden]) #gradesBox[open]) .plpd-table-wrap{max-height:calc(100cqh - 54px)}
  .split:has(.grades:not([hidden]) #gradesBox[open]) .stage{flex:none; width:min(75cqh + 18px, 60cqw);
    padding-right:var(--layout-page-content-gutter)}
}
@media (min-width:761px) and (orientation:portrait){
  .split:has(.grades:not([hidden]) #gradesBox[open]) .plpd-table-wrap{max-height:calc(50cqh - 42px)}
}

/* ---------- the card ---------- */
.stage{flex:1; min-height:0; position:relative; display:flex; justify-content:center; overflow:auto; padding:var(--space-300)}
.card{border:0; background:var(--card-card-bg); height:100%; aspect-ratio:3/4; max-width:100%; border-radius:var(--radius-xl); display:block; overflow:hidden;
  box-shadow:var(--shadow-pl-data-table-wrap-shadow)}
.card svg{display:block; width:100%; height:100%}
.card[hidden]{display:none}
.empty{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:var(--text-text-nav); font-size:15px; text-align:center; padding:0 20px;
}
.empty[hidden]{display:none}
.note,.prov{padding:8px var(--layout-page-content-gutter); color:var(--text-text-nav); font-size:13px; line-height:1.45;
  border-top:1px solid var(--surface-border-card); background:var(--surfaces-surface-2)}
.note{padding-bottom:12px}
.note b,.prov b{font-family:var(--font-display); color:var(--text-text-cell); font-weight:600}
.prov[hidden]{display:none}
.note a{color:var(--brand-brand-cyan)}

@media (max-width:760px){
  .bar{padding:12px; gap:10px 12px}
  .brand{flex-basis:100%; margin:0}
  .brand h1{font-size:20px}
  .brand img{height:26px}
  /* the level and the season share a row, the threshold and the checkbox the next, the pitcher his own */
  .field{flex:1 1 40%; min-width:0}
  .field.wide{flex-basis:100%}
  .field select.plpd-filter-dropdown,.field input.num{width:100%; min-width:0}
  #pitcherQ{width:100%; min-width:0}
  /* the page scrolls as a whole, the card at full width with the note after it */
  html,body{height:auto}
  .stage{flex:none; overflow:visible; display:block; padding:8px; min-height:160px}
  .card{width:100%; height:auto}
  .note,.prov{padding-inline:12px}
  .grades{padding:8px 8px 0}
  .grades .plpd-table-wrap{max-height:55vh}
  #gradesTable th,#gradesTable td{padding:6px 8px}
  #gradesTable td.who{max-width:190px}
}
h1,h2,h3{text-wrap:balance}
p,li,.note,.prov{text-wrap:pretty}
@media (pointer:coarse){.note a{display:inline-block; padding:12px 0; margin:-12px 0}}
</style>
</head>
<body class="plpd">

<header class="bar">
  <div class="brand">
    <img src="PitcherList_Stats_watermark_with_logo.webp" alt="Pitcher List Stats">
    <div>
      <h1>PLV Pitcher Season Card</h1>
      <span class="sub" id="status">Loading cards…</span>
    </div>
  </div>
  <div class="field plpd-filter-field">
    <label class="plpd-filter-field__label" for="level">Level</label>
    <select id="level" class="plpd-filter-dropdown" disabled></select>
  </div>
  <div class="field plpd-filter-field">
    <label class="plpd-filter-field__label" for="season">Season</label>
    <select id="season" class="plpd-filter-dropdown" disabled></select>
  </div>
  <div class="field plpd-filter-field">
    <label class="plpd-filter-field__label" for="minPitches">Min pitches</label>
    <input id="minPitches" class="num" type="number" min="0" step="50" inputmode="numeric" disabled>
  </div>
  <label class="check plpd-check"><input type="checkbox" id="split" disabled>Split traded pitchers by team</label>
  <div class="field wide plpd-filter-field">
    <label class="plpd-filter-field__label" for="pitcherQ">Pitcher</label>
    <div class="plpd-autocomplete">
      <input id="pitcherQ" class="plpd-autocomplete__input" type="text" placeholder="Name or MLBAM ID"
        autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false"
        aria-controls="pitcherList" disabled>
      <ul id="pitcherList" class="plpd-autocomplete__menu suggest-list" role="listbox" hidden></ul>
    </div>
    <select id="pitcher" hidden disabled></select>
  </div>
  <button class="btn plpd-btn" id="png" type="button" hidden>Share image ▾</button>
</header>

<div class="split" id="splitView">
<section class="grades" id="grades" hidden>
  <details id="gradesBox" open>
    <summary id="gradesSum">Grades</summary>
    <div class="plpd-table-wrap"><table class="plpd-table" id="gradesTable"></table></div>
  </details>
</section>

<main class="stage" id="stage">
  <div class="card" id="cardBox" hidden></div>
  <div class="empty" id="empty">Pick a season and a pitcher.</div>
</main>
</div>

<div class="prov" id="prov" hidden><b>PLV and Location are provisional below MLB</b> (the models aren't yet calibrated to minor-league strike zones and parks).</div>
<footer class="note">Data (especially pitch types) are subject to change.</footer>

<script src="/shared/share-image.js?v=2"></script>
<script src="card.js?v=29"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var levelSel = $('level'), seasonSel = $('season'), minIn = $('minPitches'), split = $('split'), pitcherSel = $('pitcher');
  var pitcherQ = $('pitcherQ'), pitcherList = $('pitcherList');
  var cardEl = $('cardBox'), empty = $('empty'), png = $('png'), status = $('status'), prov = $('prov');
  // the season cards live in the bucket (tools/pitcher_card/season.py writes them), a level's
  // under cards/<level>/seasons/: an index of its seasons, and beside it <season>/index.json
  // (the season's cards) and <season>/<key>.json (each card: <key> the pitcher's id, or
  // <id>-<team> for a team's part of a traded pitcher's season). A level is a Stats API sport
  // code, as on the Game Cards page; ?level=<code> opens on one, MLB otherwise. ?cards=<url>
  // points at a local build while developing (season.py --out pitcher-cards, then ?cards=cards/)
  var params = new URLSearchParams(location.search);
  var CARDS = new URL(params.get('cards') || 'https://data.blandalytics.com/cards/', location.href).href;
  var MLB = 'mlb';
  var LEVELS = [['mlb', 'MLB'], ['aaa', 'Triple-A'], ['afx', 'Single-A']];
  var level = MLB;
  var levelIx = {};                   // each level's seasons index, for the levels with season cards
  function seasonsUrl(code) { return new URL(code + '/seasons/index.json', CARDS).href; }
  function levelName(code) { return LEVELS.filter(function (l) { return l[0] === code; })[0][1]; }
  function atLevel() { return level === MLB ? '' : levelName(level) + ' '; }  // 'Triple-A ', or nothing for MLB
  var LOGO = 'PitcherList_Stats_watermark_with_logo.webp';
  // the pitch threshold over a full season at each level, prorated by the games played: half
  // MLB's below it, where pitchers throw far fewer pitches
  var FULL_MIN = {mlb: 1000, aaa: 500, afx: 500};
  var seasons = {};                   // the seasons index's seasons
  var season = null;                  // the chosen season's index
  var seasonCache = {}, cardCache = {};
  var shown = null, wanted = null;    // the card on the stage ({key, card, svg}), and the one loading

  function getJson(url) {
    return fetch(url, {cache: 'no-cache'})
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  function fill(sel, items) {         // items: [[value, label], ...]
    sel.innerHTML = '';
    items.forEach(function (it) {
      var o = document.createElement('option');
      o.value = it[0]; o.textContent = it[1];
      sel.appendChild(o);
    });
    sel.disabled = items.length === 0;
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]; });
  }
  function lastName(name) { return name.split(' ').slice(-1)[0].toLowerCase(); }
  function thousands(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function niceDate(iso) { var d = new Date(iso + 'T12:00:00'); return MONTHS[d.getMonth()] + ' ' + d.getDate(); }

  // ---- the season's cards, and the ones the threshold and the split let through ----
  // the threshold a season starts at: its level's FULL_MIN over a full season, prorated by the
  // games each team had played by its last day
  function defaultMin(ix) {
    var full = FULL_MIN[ix.level || level] || FULL_MIN[MLB];
    return Math.round(full * Math.min(1, ix.team_games / ix.full_games));
  }
  function minPitches() {
    var v = parseInt(minIn.value, 10);
    return isFinite(v) && v >= 0 ? v : defaultMin(season);
  }
  // a traded pitcher's whole season, or with the split each team's part of it, by last name
  function rows() {
    if (!season) return [];
    var min = minPitches();
    return season.pitchers.filter(function (e) {
      return (split.checked ? !e.traded : !e.stint) && e.n >= min;
    }).sort(function (a, b) {
      return lastName(a.name).localeCompare(lastName(b.name)) || a.name.localeCompare(b.name) || a.key.localeCompare(b.key);
    });
  }
  function byKey(key) { return season ? season.pitchers.filter(function (e) { return e.key === key; })[0] : null; }
  function letterOf(e, k) { return PitcherCard.letter(e.skills[k], k, PitcherCard.SEASON_GRADE_CUTS); }

  // the state in the URL: #<season>/<key>, and the threshold and the split when not the defaults
  function saveState() {
    var q = new URLSearchParams(location.search);
    if (season && minPitches() !== defaultMin(season)) q.set('min', minPitches()); else q.delete('min');
    if (split.checked) q.set('split', '1'); else q.delete('split');
    if (level !== MLB) q.set('level', level); else q.delete('level');
    var s = q.toString();
    var hash = season && pitcherSel.value ? '#' + season.season + '/' + pitcherSel.value : '';
    history.replaceState(null, '', location.pathname + (s ? '?' + s : '') + hash);
  }

  // the Pitcher list and the table, keeping the pitcher on stage when he is still listed (or, as
  // the split turns, his whole season or his biggest part of it); else the top of the Stuff column
  function refresh(prefer) {
    var list = rows(), keys = list.map(function (e) { return e.key; });
    listed = list;
    fill(pitcherSel, list.map(function (e) { return [e.key, e.name + '  ·  ' + e.team]; }));
    var cur = prefer || pitcherSel.dataset.key, pick = null;
    if (cur && keys.indexOf(cur) >= 0) pick = cur;
    else if (cur) pick = sameSeason(cur, list);
    pitcherSel.value = pick || topByStuff(list) || '';
    drawGrades(list);
    onPitcher();
  }
  function sameSeason(key, list) {
    var id = key.split('-')[0];
    var his = list.filter(function (e) { return String(e.id) === id; })
      .sort(function (a, b) { return b.n - a.n; });
    return his.length ? his[0].key : null;
  }
  function topByStuff(list) {
    var best = null;
    list.forEach(function (e) { if (e.skills.stuff != null && (!best || e.skills.stuff > best.skills.stuff)) best = e; });
    return best ? best.key : list[0] ? list[0].key : null;
  }

  // ---- the card ----
  function loadCard(key) {
    var url = new URL(season.season + '/' + key + '.json', seasonsUrl(level)).href;
    if (!(url in cardCache)) cardCache[url] = getJson(url).catch(function () { delete cardCache[url]; return null; });
    return cardCache[url];
  }
  function clearStage(text) {
    shown = null; wanted = null;
    cardEl.hidden = true; cardEl.innerHTML = '';
    empty.hidden = false; png.hidden = true;
    empty.textContent = text;
  }
  function onPitcher() {
    var key = pitcherSel.value, e = byKey(key);
    pitcherSel.dataset.key = key;
    showPicked(e);
    markGradeRow();
    saveState();
    if (!e) {
      clearStage(season ? 'No ' + atLevel() + 'pitchers with ' + thousands(minPitches()) + '+ pitches in ' + season.season + '.' : 'No season cards yet.');
      document.title = 'PLV Pitcher Season Card';
      return;
    }
    document.title = e.name + ' — ' + season.season + ' ' + atLevel() + (e.stint ? e.team + ' ' : '') + '— PLV Pitcher Season Card';
    var id = level + ':' + season.season + '/' + key;
    if ((shown && shown.key === id) || wanted === id) return;
    wanted = id;
    loadCard(key).then(function (card) {
      if (wanted !== id) return;       // a later pick has superseded this one
      wanted = null;
      if (!card) { clearStage('Could not load this card.'); return; }
      var svg = PitcherCard.draw(cardEl, card, {logo: LOGO});
      shown = {key: id, card: card, svg: svg};
      cardEl.hidden = false; empty.hidden = true; png.hidden = false;
    });
  }

  // ---- the grades table: every card the Pitcher list offers, with its pitches, innings, season
  // letters and Stuff+ by pitch type. A name opens that card; a column header sorts by it (the
  // letters by the means behind them).
  var gradesEl = $('grades'), gradesBox = $('gradesBox'), gradesSum = $('gradesSum'), gradesTable = $('gradesTable');
  var SKILLS = [['stuff', 'Stuff'], ['loc', 'Locations'], ['plv', 'PLV']];
  var PITCH_ORDER = ['FF', 'SI', 'FC', 'SL', 'ST', 'CU', 'CH', 'FS', 'KN', 'UN'];
  var sortBy = 'stuff', sortAsc = false;  // Stuff, best first, until a header is picked
  var gradesDrawn = null, rowShown = null;
  var OPEN_KEY = 'pitcherCards.seasonGradesOpen';

  // his Stuff+ by pitch type, for the types he threw at least 1% as often as the threshold asks
  // of a season (10 pitches at 1,000); every type, from an index without the counts
  var TYPE_SHARE = 0.01;
  function stuffShown(e) {
    var floor = TYPE_SHARE * minPitches(), out = {};
    Object.keys(e.stuff).forEach(function (c) {
      if (!e.thrown || (e.thrown[c] || 0) >= floor) out[c] = e.stuff[c];
    });
    return out;
  }
  function innings(ip) {                  // '174.2' -> 174 2/3
    if (ip == null) return null;
    var p = String(ip).split('.');
    return +p[0] + (+(p[1] || 0)) / 3;
  }
  function sortKey(e, col) {               // null sorts last either way
    if (col === 'who') return lastName(e.name) + ' ' + e.name;
    if (col === 'n') return e.n;
    if (col === 'ip') return innings(e.ip);
    if (col.indexOf('pt:') === 0) { var v = stuffShown(e)[col.slice(3)]; return v == null ? null : v; }
    return e.skills[col] == null ? null : e.skills[col];
  }
  function sorted(list) {
    return list.map(function (x, i) { return {x: x, i: i, k: sortKey(x, sortBy)}; }).sort(function (a, b) {
      if (a.k === null || b.k === null) return (a.k === null) - (b.k === null) || a.i - b.i;
      var c = typeof a.k === 'string' ? a.k.localeCompare(b.k) : a.k - b.k;
      return (sortAsc ? c : -c) || a.i - b.i;
    }).map(function (y) { return y.x; });
  }
  function headCell(col, label, cls, title) {
    var sort = sortBy === col ? (sortAsc ? 'ascending' : 'descending') : 'none';
    return '<th scope="col" class="' + (cls || '') + '" aria-sort="' + sort + '"' + (title ? ' title="' + esc(title) + '"' : '')
      + '><button type="button" data-sort="' + col + '">' + label + '</button></th>';
  }
  function letterCell(l, cls) {
    return '<td class="g' + (cls ? ' ' + cls : '') + '" style="color:' + (PitcherCard.GRADE_COLORS[l] || '') + '">' + esc(l) + '</td>';
  }
  function drawGrades(list) {
    gradesDrawn = list;
    if (!list.length) { gradesEl.hidden = true; return; }
    var codes = PITCH_ORDER.filter(function (c) { return list.some(function (e) { return c in stuffShown(e); }); });
    var head = '<thead><tr class="group"><th class="who"></th><th></th><th></th><th colspan="3" class="first">Grades</th>'
      + (codes.length ? '<th colspan="' + codes.length + '" class="first">Stuff+ by pitch type</th>' : '') + '</tr>'
      + '<tr class="cols">' + headCell('who', 'Pitcher', 'who') + headCell('n', '#', 'n', 'Pitches') + headCell('ip', 'IP', 'n', 'Innings pitched')
      + SKILLS.map(function (s, i) { return headCell(s[0], s[1], i ? '' : 'first'); }).join('')
      + codes.map(function (c, i) {
        return headCell('pt:' + c, '<span style="color:' + PitcherCard.MARKER_COLORS[c] + '">' + c + '</span>',
          i ? '' : 'first', PitcherCard.PITCH_NAMES[c] + ' Stuff+');
      }).join('') + '</tr></thead>';
    // an index on the season scale (season.py's plus_scale) colours on its season bins
    var bins = season.plus_scale === PitcherCard.SEASON_SCALE ? PitcherCard.SEASON_TYPE_BINS : undefined;
    var body = sorted(list).map(function (e) {
      var shown = stuffShown(e);
      return '<tr data-key="' + esc(e.key) + '"' + (e.key === pitcherSel.value ? ' class="on"' : '') + '>'
        + '<td class="who"><a href="#' + season.season + '/' + esc(e.key) + '" data-key="' + esc(e.key) + '">' + esc(e.name) + '</a>'
        + '<span class="meta">' + esc(e.team) + (e.gs && e.gs * 2 >= e.g ? ' · SP' : '') + '</span></td>'
        + '<td class="n">' + thousands(e.n) + '</td>'
        + '<td class="n">' + (e.ip == null ? '' : esc(e.ip)) + '</td>'
        + SKILLS.map(function (s, i) { return letterCell(letterOf(e, s[0]), i ? '' : 'first'); }).join('')
        + codes.map(function (c, i) {
          var cls = i ? '' : ' class="first"';
          if (!(c in shown)) return '<td' + cls + '></td>';
          var cell = PitcherCard.statCell(c, 'plvStuff+', shown[c], bins);
          return '<td' + cls + ' style="color:' + cell.color + '">' + esc(cell.text) + '</td>';
        }).join('') + '</tr>';
    }).join('');
    var wrap = gradesTable.parentNode, top = wrap.scrollTop, left = wrap.scrollLeft;
    gradesTable.innerHTML = head + '<tbody>' + body + '</tbody>';
    wrap.scrollTop = top; wrap.scrollLeft = left;
    gradesSum.innerHTML = 'Grades and Stuff+ <span class="n">· ' + list.length + ' pitcher' + (list.length === 1 ? '' : 's')
      + ' with ' + thousands(minPitches()) + '+ pitches</span>';
    gradesEl.hidden = false;
    rowShown = null;
    showGradeRow();
  }
  function markGradeRow() {
    [].forEach.call(gradesTable.querySelectorAll('tbody tr'), function (tr) {
      tr.classList.toggle('on', tr.getAttribute('data-key') === pitcherSel.value);
    });
    showGradeRow();
  }
  // a newly picked pitcher's row, scrolled into the table's own box (never the page) clear of its sticky head
  function showGradeRow() {
    var tr = gradesTable.querySelector('tbody tr.on'), wrap = gradesTable.parentNode;
    if (!tr || !gradesBox.open || rowShown === pitcherSel.value) return;
    rowShown = pitcherSel.value;
    var head = gradesTable.tHead.offsetHeight, top = tr.offsetTop, bottom = top + tr.offsetHeight;
    if (top - head < wrap.scrollTop) wrap.scrollTop = top - head;
    else if (bottom > wrap.scrollTop + wrap.clientHeight) wrap.scrollTop = bottom - wrap.clientHeight;
  }
  gradesTable.addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-sort]');
    if (b && gradesDrawn) {
      var col = b.getAttribute('data-sort');
      if (sortBy === col) sortAsc = !sortAsc;
      else { sortBy = col; sortAsc = col === 'who'; }  // names A-Z, the rest best (or most) first
      drawGrades(gradesDrawn);
      return;
    }
    // a plain click anywhere in a row opens its card here; with a modifier the name's link opens
    // a new tab as usual, and a drag that selects text in the row isn't a click
    var tr = ev.target.closest('tbody tr[data-key]');
    if (!tr || ev.button !== 0 || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
    if (!ev.target.closest('a[data-key]') && String(window.getSelection && window.getSelection()).trim()) return;
    ev.preventDefault();
    pitcherSel.value = tr.getAttribute('data-key');
    onPitcher();
    var r = $('stage').getBoundingClientRect();
    if (Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 0) < r.height / 2) $('stage').scrollIntoView({behavior: 'smooth'});
  });
  try { if (localStorage.getItem(OPEN_KEY) === '0') gradesBox.open = false; } catch (e) {}
  gradesBox.addEventListener('toggle', function () {
    try { localStorage.setItem(OPEN_KEY, gradesBox.open ? '1' : '0'); } catch (e) {}
    showGradeRow();
  });

  // ---- choosing a season ----
  function loadSeason(year) {
    var key = level + ':' + year;
    if (!seasonCache[key]) {
      seasonCache[key] = getJson(new URL(year + '/index.json', seasonsUrl(level)).href)
        .catch(function (err) { delete seasonCache[key]; throw err; });
    }
    return seasonCache[key];
  }
  // a season, at its own threshold unless one is given; ``key`` picks a card, which shows
  // whatever its pitch count (the threshold comes down to it) and turns the split on for a stint
  function openSeason(year, min, key) {
    seasonSel.value = String(year);
    var lvl = level;
    return loadSeason(year).then(function (ix) {
      if (seasonSel.value !== String(year) || level !== lvl) return;
      season = ix;
      minIn.placeholder = String(defaultMin(ix));
      minIn.value = min != null ? min : defaultMin(ix);
      minIn.disabled = split.disabled = false;
      var e = key ? byKey(key) : null;
      if (e && e.stint) split.checked = true;
      if (e && e.n < minPitches()) minIn.value = e.n;
      status.textContent = ix.season + ' ' + atLevel() + 'regular season, through ' + niceDate(ix.through) + ' · '
        + thousands(ix.pitchers.length) + ' cards';
      refresh(e ? e.key : null);
    }).catch(function () {
      if (level !== lvl) return;
      season = null;
      fill(pitcherSel, []);
      listed = [];
      showPicked(null);
      gradesEl.hidden = true;
      clearStage('Could not load the ' + year + ' ' + atLevel() + 'season cards.');
    });
  }

  seasonSel.addEventListener('change', function () { pitcherSel.dataset.key = ''; openSeason(+seasonSel.value, null, null); });
  // another level opens on the same season if it has one (else its latest), at its own
  // threshold, and keeps the pitcher on stage if he is listed there too
  levelSel.addEventListener('change', function () { openLevel(levelSel.value, false); });
  var minTimer = null;
  minIn.addEventListener('input', function () {
    clearTimeout(minTimer);
    minTimer = setTimeout(function () { if (season) refresh(); }, 250);
  });
  split.addEventListener('change', function () { if (season) refresh(); });
  pitcherSel.addEventListener('change', onPitcher);

  // ---- the Pitcher box: Model Drilldown's name entry over the pitchers listed (the threshold and
  // the split applied), picking into the hidden select. Typing ranks full-name starts, then
  // last-name starts, then anything containing it or an MLBAM id starting with it, most
  // pitches first within each; arrows and Enter pick, Escape closes, and leaving it empty
  // puts the pitcher on stage back.
  var listed = [], suggested = [], active = -1, committed = false;
  function normalize(t) {
    return t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase()
      .replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  }
  function label(e) { return e.name + (e.stint ? '  ·  ' + e.team : ''); }
  function showPicked(e) {             // the box shows the pitcher on stage, unless being typed in
    pitcherQ.disabled = pitcherSel.disabled;
    if (document.activeElement === pitcherQ && !committed) return;
    pitcherQ.value = e ? label(e) : '';
    committed = true;
  }
  function suggestions(query) {
    var q = normalize(query);
    if (!q) return listed.slice();
    var scored = [];
    listed.forEach(function (e) {
      var full = normalize(e.name), last = full.slice(full.lastIndexOf(' ') + 1), score;
      if (full.indexOf(q) === 0) score = 0;
      else if (last.indexOf(q) === 0) score = 1;
      else if (full.indexOf(q) >= 0 || String(e.id).indexOf(q) === 0) score = 2;
      else return;
      scored.push([score, e]);
    });
    scored.sort(function (a, b) { return a[0] - b[0] || b[1].n - a[1].n; });
    return scored.map(function (x) { return x[1]; });
  }
  function showSuggestions() {
    suggested = suggestions(pitcherQ.value).slice(0, 400);
    active = -1;
    pitcherList.innerHTML = suggested.map(function (e, i) {
      var on = e.key === pitcherSel.value ? ' aria-selected="true"' : '';
      return '<li role="option" data-index="' + i + '"' + on + '><span>' + esc(label(e)) + '</span><small>'
        + esc((e.hand ? e.hand + 'HP - ' : '') + e.team) + '</small></li>';  // e.team: his teams, '/'-joined
    }).join('');
    pitcherList.hidden = !suggested.length;
    pitcherQ.setAttribute('aria-expanded', suggested.length ? 'true' : 'false');
  }
  function hideSuggestions() {
    pitcherList.hidden = true;
    pitcherQ.setAttribute('aria-expanded', 'false');
    suggested = []; active = -1;
  }
  function setActive(i) {
    active = i;
    [].forEach.call(pitcherList.children, function (li, k) { li.classList.toggle('active', k === i); });
    if (i >= 0) pitcherList.children[i].scrollIntoView({block: 'nearest'});
  }
  function startSearch() {
    if (committed) { pitcherQ.value = ''; committed = false; }
    showSuggestions();
  }
  function pickSuggested(e) {
    hideSuggestions();
    committed = true;
    pitcherSel.value = e.key;
    onPitcher();
    pitcherQ.blur();
  }
  pitcherQ.addEventListener('input', function () { committed = false; showSuggestions(); });
  pitcherQ.addEventListener('focus', startSearch);
  pitcherQ.addEventListener('click', function () { if (pitcherList.hidden) startSearch(); });
  pitcherQ.addEventListener('blur', function () {
    setTimeout(function () {
      hideSuggestions();
      if (!committed || !pitcherQ.value.trim()) { committed = false; showPicked(byKey(pitcherSel.value)); }
    }, 150);
  });
  pitcherQ.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') { hideSuggestions(); pitcherQ.blur(); return; }  // even with nothing listed
    if (pitcherList.hidden) {
      if (ev.key === 'ArrowDown') { ev.preventDefault(); showSuggestions(); if (suggested.length) setActive(0); }
      return;
    }
    if (ev.key === 'ArrowDown') { ev.preventDefault(); setActive((active + 1) % suggested.length); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); setActive((active - 1 + suggested.length) % suggested.length); }
    else if (ev.key === 'Enter') {
      ev.preventDefault();
      if (active >= 0) pickSuggested(suggested[active]);
      else if (suggested.length === 1) pickSuggested(suggested[0]);
    }
  });
  pitcherList.addEventListener('pointerdown', function (ev) {
    var li = ev.target.closest('li');
    if (!li) return;
    ev.preventDefault();
    pickSuggested(suggested[+li.getAttribute('data-index')]);
  });
  pitcherList.addEventListener('pointermove', function (ev) {
    var li = ev.target.closest('li');
    if (li) setActive(+li.getAttribute('data-index'));
  });

  // Share image (shared/share-image.js): the card at 3000 x 4000
  var sharedCard = null;
  ShareImage.image(png, function () {
    if (!shown) throw new Error('no card');
    sharedCard = shown;
    return PitcherCard.png(shown.svg);
  }, function () { return sharedCard ? PitcherCard.filename(sharedCard.card) : 'card.png'; });

  // #<season>/<key> in the URL picks that card; ?min= and ?split=1 set the filters
  function fromHash() {
    var m = /^#(\d{4})\/([\w-]+)$/.exec(location.hash);
    return m && seasons[m[1]] ? {year: +m[1], key: m[2]} : null;
  }
  window.addEventListener('hashchange', function () {
    var h = fromHash();
    if (!h || (season && h.year === season.season && h.key === pitcherSel.value)) return;
    if (season && h.year === season.season) {
      var e = byKey(h.key);
      if (e && e.stint) split.checked = true;
      if (e && e.n < minPitches()) minIn.value = e.n;
      refresh(h.key);
    } else openSeason(h.year, null, h.key);
  });

  // a level's seasons, opening the URL's season and card the first time (with its threshold and
  // split), else the season on show if it has one
  function openLevel(code, first) {
    level = code;
    levelSel.value = code;
    prov.hidden = code === MLB;
    seasons = levelIx[code].seasons;
    var years = Object.keys(seasons).sort().reverse();
    fill(seasonSel, years.map(function (y) { return [y, y]; }));
    if (!first) {
      openSeason(season && seasons[season.season] ? season.season : +years[0], null, null);
      return;
    }
    var h = fromHash(), q = parseInt(params.get('min'), 10);
    split.checked = params.get('split') === '1';
    openSeason(h ? h.year : +years[0], isFinite(q) && q >= 0 ? q : null, h ? h.key : null);
  }

  // every level's seasons index; a level without season cards is left out of the Level list
  Promise.all(LEVELS.map(function (l) {
    return getJson(seasonsUrl(l[0])).then(function (ix) { return [l[0], ix]; }, function () { return null; });
  })).then(function (got) {
    got.forEach(function (x) { if (x && Object.keys(x[1].seasons || {}).length) levelIx[x[0]] = x[1]; });
    var have = LEVELS.filter(function (l) { return levelIx[l[0]]; });
    if (!have.length) {
      status.textContent = 'Could not load the season cards';
      clearStage('The season cards are missing from the bucket. Run tools/pitcher_card/season.py to build them.');
      return;
    }
    fill(levelSel, have);
    var want = params.get('level'), codes = have.map(function (l) { return l[0]; });
    openLevel(codes.indexOf(want) >= 0 ? want : codes.indexOf(MLB) >= 0 ? MLB : codes[0], true);
  });
})();
</script>
</body>
</html>
