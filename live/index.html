<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#0d1117; --surface:#151b23; --raise:#1b222c;
  --ink:#e3e9f1; --muted:#8a96a6; --faint:#6b7684;
  --rule:#242c37; --rule-soft:#1e252f;
  --away:#9fb0c4; --home:#9fb0c4;
  --live:#54d29b;
  --ball:#54d29b; --called:#f04542; --swing:#f04542; --foul:#ffe066; --inplay:#2d99c8; --hbp:#93cde6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
a{color:inherit}

/* ---------- top bar ---------- */
.bar{
  display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 18px;
  padding:16px 20px 14px; border-bottom:1px solid var(--rule); background:var(--surface);
}
.brand{margin-right:auto; display:flex; flex-direction:column; gap:2px}
.brand h1{margin:0; font-size:19px; font-weight:700; letter-spacing:-.01em}
.brand .sub{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
  font-variant-numeric:tabular-nums;
}
.brand .sub .dot{
  display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--faint);
  margin-right:7px; vertical-align:1px;
}
.brand .sub .dot.on{background:var(--live); box-shadow:0 0 0 3px rgba(84,210,155,.18)}
.field{display:flex; flex-direction:column; gap:5px; min-width:150px}
.field label{
  font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600;
}
select{
  appearance:none; -webkit-appearance:none;
  font:inherit; font-size:14px; font-weight:500; color:var(--ink);
  background:var(--raise) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%238a96a6' stroke-width='1.5'/></svg>") no-repeat right 11px center;
  border:1px solid var(--rule); border-radius:6px; padding:8px 30px 8px 11px; cursor:pointer;
}
select:hover{border-color:var(--faint)}
select:focus-visible{outline:2px solid var(--ink); outline-offset:1px}

/* ---------- layout ---------- */
.wrap{flex:1; min-height:0; display:flex}
.list{
  width:300px; flex:none; overflow-y:auto; border-right:1px solid var(--rule);
  padding:14px 12px 24px; display:flex; flex-direction:column; gap:14px;
}
.stage{flex:1; min-width:0; overflow-y:auto; padding:22px 28px 48px}
.empty{color:var(--muted); padding:40px 0; text-align:center}

/* ---------- game list ---------- */
.group h2{
  margin:0 0 6px 6px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--muted); font-weight:600;
}
.game{
  display:grid; grid-template-columns:1fr auto; grid-template-rows:auto auto; column-gap:10px;
  width:100%; text-align:left; font:inherit; color:inherit; cursor:pointer;
  background:transparent; border:1px solid transparent; border-radius:7px; padding:8px 10px;
}
.game:hover{background:var(--raise)}
.game.sel{background:var(--surface); border-color:var(--rule)}
.game:focus-visible{outline:2px solid var(--ink); outline-offset:1px}
.game .teams{grid-column:1; grid-row:1; display:flex; flex-direction:column; gap:1px; font-weight:600; font-variant-numeric:tabular-nums}
.game .teams span{display:flex; justify-content:space-between; gap:8px}
.game .teams b{font-weight:600; min-width:2.6em}
.game .teams i{font-style:normal; color:var(--muted); font-weight:500}
.game .state{grid-column:2; grid-row:1; align-self:center; text-align:right; font-size:12.5px; color:var(--muted); white-space:nowrap}
.game .state.live{color:var(--live); font-weight:600}
.game .tag{grid-column:1/3; grid-row:2; margin-top:3px; font-size:11px; color:var(--faint)}
.game .tag .no{color:var(--faint)}
.game .tag .yes{color:var(--muted)}

/* ---------- masthead ---------- */
.mast{display:flex; flex-direction:column; gap:12px; margin-bottom:22px}
.eyebrow{
  font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  display:flex; flex-wrap:wrap; gap:6px 14px;
}
.score h1{
  font-weight:600; font-size:clamp(30px,5.2vw,48px); line-height:1.02; margin:0;
  letter-spacing:-.005em; font-variant-numeric:tabular-nums;
}
.score h1 .at{color:var(--faint); font-weight:500; padding:0 .12em; margin-left:.2em}
.score h1 .away{color:var(--away)}
.score h1 .home{color:var(--home)}
.situ{display:flex; flex-wrap:wrap; align-items:center; gap:8px 18px; color:var(--muted); font-size:14px}
.situ b{color:var(--ink); font-weight:600}
.situ .live{color:var(--live); font-weight:600}
.note{color:var(--muted); max-width:62ch; margin:0}

/* ---------- linescore ---------- */
.linewrap{overflow-x:auto; margin-bottom:24px}
table{border-collapse:collapse; font-variant-numeric:tabular-nums}
.line{font-size:13px}
.line th,.line td{border-bottom:1px solid var(--rule-soft); padding:6px 0; text-align:center; font-weight:500}
.line thead th{color:var(--faint); font-size:11px; letter-spacing:.08em; font-weight:500}
.line tbody th{text-align:left; font-weight:500; font-size:15px; padding-right:20px; white-space:nowrap}
.line tbody tr.team--away th{color:var(--away)}
.line tbody tr.team--home th{color:var(--home)}
.line td{color:var(--faint); width:34px}
.line td.got{color:var(--ink); font-weight:600}
.line td.cur{box-shadow:inset 0 -2px 0 var(--live)}
.line .tt{color:var(--ink); font-weight:600; border-left:1px solid var(--rule-soft); width:42px}
.line tbody tr:last-child th,.line tbody tr:last-child td{border-bottom:none}

/* ---------- panels ---------- */
.panels{display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); gap:20px; align-items:start}
.panel{background:var(--surface); border:1px solid var(--rule); border-radius:8px; padding:14px 16px 16px; box-shadow:var(--shadow); min-width:0; overflow-x:auto}
.panel h2{
  margin:0 0 10px; font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600;
  display:flex; justify-content:space-between; gap:12px;
}
.panel h2 span{letter-spacing:0; text-transform:none; font-weight:500; color:var(--faint)}
.wide{grid-column:1/3}

/* current at-bat */
.ab{display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px 18px; align-items:start}
.ab .who{grid-column:1/3; display:flex; flex-wrap:wrap; justify-content:space-between; gap:6px 16px; font-size:15px}
.ab .who b{font-weight:600}
.ab .who i{font-style:normal; color:var(--muted); font-size:13px}
.count{display:flex; align-items:center; gap:14px; grid-column:1/3; font-size:13px; color:var(--muted)}
.count .sq{display:inline-flex; gap:4px; margin-left:6px; vertical-align:-1px}
.count .sq i{width:9px; height:9px; border-radius:2px; background:var(--rule); display:inline-block}
.count .sq i.b{background:var(--ball)} .count .sq i.s{background:var(--called)} .count .sq i.o{background:var(--foul)}
.zone{width:150px; height:auto; display:block}
.zone .plate{fill:none; stroke:var(--faint); stroke-width:.04}
.zone .grid{stroke:var(--rule); stroke-width:.02}
.zone circle{stroke:var(--ground); stroke-width:.04}
.zone circle.last{stroke:#fff; stroke-width:.06}
.zone text{font-size:.17px; font-weight:700; fill:#0d1117; text-anchor:middle; dominant-baseline:central; pointer-events:none}
.zone .rh,.zone .lh{font-size:.16px; fill:var(--faint); font-weight:500}
.seq{display:flex; flex-direction:column; gap:3px; font-size:13px; font-variant-numeric:tabular-nums}
.seq .row{display:grid; grid-template-columns:16px minmax(0,1fr) 2.8em minmax(0,1.35fr); gap:8px; align-items:start; padding:2px 0}
.seq .row>span:nth-child(2){white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seq .row.last{color:#fff}
.seq .n{color:var(--faint); text-align:right}
.seq .r{display:flex; flex-wrap:wrap; align-items:center; gap:2px 6px; color:var(--muted)}
.seq .r>span:first-of-type{white-space:nowrap}
.seq .row.last .r{color:var(--ink)}
.seq .sw{width:8px; height:8px; border-radius:50%; flex:none}
.seq .ev{color:var(--faint); font-size:12px; flex-basis:100%; padding-left:14px}
.seq .none{color:var(--faint)}
.fill-ball{background:var(--ball); fill:var(--ball)} .fill-called{background:var(--called); fill:var(--called)}
.fill-swing{background:var(--swing); fill:var(--swing)} .fill-foul{background:var(--foul); fill:var(--foul)}
.fill-inplay{background:var(--inplay); fill:var(--inplay)} .fill-hbp{background:var(--hbp); fill:var(--hbp)}
.fill-other{background:var(--faint); fill:var(--faint)}
.zone circle.fill-swing{stroke:#fff; stroke-width:.03}

/* pitch mix */
.mix{width:100%; font-size:13px}
.mix th{color:var(--faint); font-size:11px; letter-spacing:.06em; font-weight:500; text-align:right; padding:0 0 6px 8px; white-space:nowrap}
.mix th:first-child,.mix td:first-child{text-align:left; padding-left:0}
.mix td{padding:4px 0 4px 8px; text-align:right; border-top:1px solid var(--rule-soft)}
.mix td.t{font-weight:600}
.mix .dim{color:var(--faint)}

/* plays */
.plays{display:flex; flex-direction:column; gap:2px}
.play{
  display:grid; grid-template-columns:38px 1fr; gap:10px; padding:7px 10px; border-radius:5px;
  border-left:3px solid var(--faint); font-size:13.5px; background:var(--raise);
}
.play .inn{color:var(--faint); font-size:12px; font-variant-numeric:tabular-nums; padding-top:2px}
.play .what{display:flex; flex-direction:column; gap:1px}
.play .what b{font-weight:600}
.play .what span{color:var(--muted); font-size:13px}
.play.now{border-left-color:var(--live); border-left-style:dashed}
.play.rbi .what b{color:#fff}

@media (max-width:820px){
  .wrap{flex-direction:column}
  .list{
    width:auto; flex-direction:row; overflow-x:auto; overflow-y:hidden; gap:10px;
    padding:10px 12px; border-right:0; border-bottom:1px solid var(--rule);
  }
  .group{display:flex; gap:8px; flex:none}
  .group h2{display:none}
  .game{width:190px; flex:none}
  .stage{padding:18px 14px 40px}
  .panels{grid-template-columns:minmax(0,1fr)}
  .wide{grid-column:auto}
  .ab{grid-template-columns:minmax(0,1fr)}
  .ab .who,.count{grid-column:auto}
  .zone{width:180px; margin:0 auto}
  .bar{padding:12px 12px 10px; gap:10px 12px}
  .brand{flex-basis:100%; margin:0}
  .field{flex:1; min-width:0}
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">
    <h1>Live</h1>
    <span class="sub" id="status"><i class="dot"></i>Loading…</span>
  </div>
  <div class="field">
    <label for="league">League</label>
    <select id="league"><option value="">All leagues</option></select>
  </div>
</header>

<div class="wrap">
  <aside class="list" id="list"></aside>
  <main class="stage" id="stage"><div class="empty">Loading today's games…</div></main>
</div>

<script>
(function () {
  // ?data=<base> points the page at a local copy of the feed while developing
  var DATA = new URLSearchParams(location.search).get('data') || 'https://data.blandalytics.com';
  var POLL_MS = 30000;

  var $ = function (id) { return document.getElementById(id); };
  var list = $('list'), stage = $('stage'), status = $('status'), leagueSel = $('league');

  var today = null;          // today.json
  var games = {};            // gamePk -> today.json entry
  var selected = null;       // gamePk
  var detail = {};           // gamePk -> live/games/<pk>.json
  var timer = null;

  // ---- club colours, as render.py derives them: nudged toward white until they read on the ground
  var TEAM_HEX = {
    ARI:"#a71930", AZ:"#a71930", ATH:"#003831", ATL:"#ce1141", BAL:"#df4601", BOS:"#bd3039",
    CHC:"#0e3386", CIN:"#c6011f", CLE:"#00385d", COL:"#33006f", CWS:"#27251f", CHW:"#27251f",
    DET:"#0c2340", HOU:"#002d62", KC:"#004687", LAA:"#ba0021", LAD:"#005a9c", MIA:"#00a3e0",
    MIL:"#12284b", MIN:"#002b5c", NYM:"#002d72", NYY:"#003087", OAK:"#003831", PHI:"#e81828",
    PIT:"#fdb827", SD:"#2f241d", SEA:"#0c2c56", SF:"#fd5a1e", STL:"#c41e3a", TB:"#092c5c",
    TEX:"#003278", TOR:"#134a8e", WSH:"#ab0003"
  };
  function rgb(h) { return [1, 3, 5].map(function (i) { return parseInt(h.substr(i, 2), 16); }); }
  function lum(h) {
    var c = rgb(h).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  }
  function contrast(a, b) { var x = lum(a), y = lum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); }
  function mix(a, b, t) {
    var p = rgb(a), q = rgb(b);
    return '#' + p.map(function (v, i) { var n = Math.round(v + (q[i] - v) * t); return (n < 16 ? '0' : '') + n.toString(16); }).join('');
  }
  function accent(abbr) {
    var base = TEAM_HEX[(abbr || '').toUpperCase()] || '#7f8c99';
    for (var i = 0; i <= 100; i++) { var c = mix(base, '#ffffff', i / 100); if (contrast(c, '#0d1117') >= 4.5) return c; }
    return '#ffffff';
  }

  var PITCH_NAME = {FF:"Four-Seam", SI:"Sinker", FT:"Two-Seam", FC:"Cutter", SL:"Slider", ST:"Sweeper", SV:"Slurve",
    CU:"Curveball", KC:"Knuckle Cv", CS:"Slow Curve", CH:"Changeup", FS:"Splitter", FO:"Forkball", SC:"Screwball",
    KN:"Knuckler", EP:"Eephus", PO:"Pitchout", FA:"Fastball"};
  var RESULT_NAME = {"Swinging Strike (Blocked)":"Swinging Strike", "In play, out(s)":"In play, out",
    "In play, no out":"In play", "In play, run(s)":"In play, run", "Ball In Dirt":"Ball in dirt"};
  var EVENT_COLOUR = {walk:"#93cde6", intent_walk:"#93cde6", hit_by_pitch:"#93cde6", catcher_interf:"#93cde6",
    single:"#2d99c8", double:"#54d29b", triple:"#ffe066", home_run:"#f04542"};
  var OUT_COLOUR = "#6b7684";

  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
  function eventName(e) {
    if (!e) return '';
    return e.replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); })
      .replace('Grounded Into Double Play', 'GIDP').replace('Field Out', 'Out').replace('Sac Fly', 'Sac fly');
  }
  // what a pitch was, for colour: ball / called / swing / foul / inplay / hbp
  function kind(p) {
    var d = p.description || '';
    if (/In play/.test(d)) return 'inplay';
    if (/Hit By Pitch/.test(d)) return 'hbp';
    if (/Foul/.test(d)) return 'foul';
    if (/Swinging|Missed Bunt/.test(d)) return 'swing';
    if (/Called Strike/.test(d)) return 'called';
    if (/Ball|Pitchout|Intent/.test(d)) return 'ball';
    return 'other';
  }
  function half(h) { return h === 'Top' ? 'Top' : h === 'Bottom' ? 'Bot' : h === 'Middle' ? 'Mid' : h === 'End' ? 'End' : h; }
  function ordinal(n) { var s = ['th', 'st', 'nd', 'rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function clock(iso) {
    return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function hhmm(iso) { return new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', second: '2-digit' }); }
  function niceDate(iso) {
    var d = new Date(iso + 'T12:00:00');
    return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ', ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' + d.getDate();
  }
  function shortLeague(g) {
    var n = g.sport.name;
    return n === 'Major League Baseball' ? 'MLB' : n;
  }
  function isLive(g) { return g.status.abstract === 'Live'; }
  function isFinal(g) { return g.status.abstract === 'Final'; }

  // ---- the game list ------------------------------------------------------
  function stateText(g) {
    if (isLive(g)) return (g.half ? half(g.half) + ' ' + g.inning : g.status.detailed);
    if (isFinal(g)) {
      if (g.status.detailed !== 'Final' && g.status.detailed !== 'Game Over') return g.status.detailed;
      return 'Final' + (g.inning && g.inning !== 9 ? '/' + g.inning : '');
    }
    if (/Delayed|Postponed|Suspended|Cancel|Warmup|Pre-Game/i.test(g.status.detailed)) return g.status.detailed;
    return clock(g.startTime);
  }
  function gameCard(g) {
    var live = isLive(g), fin = isFinal(g), scored = live || fin;
    var track = g.tracked === true ? '<span class="yes">pitch tracking</span>'
              : g.tracked === false ? '<span class="no">no tracking</span>' : '';
    return '<button class="game' + (String(g.gamePk) === String(selected) ? ' sel' : '') + '" data-pk="' + g.gamePk + '">'
      + '<div class="teams">'
      + '<span><b>' + esc(g.away.abbr || g.away.name) + '</b><i>' + (scored ? (g.away.score == null ? '' : g.away.score) : '') + '</i></span>'
      + '<span><b>' + esc(g.home.abbr || g.home.name) + '</b><i>' + (scored ? (g.home.score == null ? '' : g.home.score) : '') + '</i></span>'
      + '</div>'
      + '<div class="state' + (live ? ' live' : '') + '">' + esc(stateText(g)) + '</div>'
      + '<div class="tag">' + esc(shortLeague(g)) + (g.date !== today.games[today.games.length - 1].date ? ' · ' + niceDate(g.date) : '') + (track ? ' · ' + track : '') + '</div>'
      + '</button>';
  }
  function order(a, b) {
    var ra = isLive(a) ? 0 : !isFinal(a) ? 1 : 2, rb = isLive(b) ? 0 : !isFinal(b) ? 1 : 2;
    if (ra !== rb) return ra - rb;
    if (a.sport.id !== b.sport.id) return a.sport.id - b.sport.id;
    return a.startTime < b.startTime ? -1 : a.startTime > b.startTime ? 1 : a.gamePk - b.gamePk;
  }
  function visibleGames() {
    var lg = leagueSel.value;
    return today.games.filter(function (g) { return !lg || String(g.sport.id) === lg; }).sort(order);
  }
  function renderList() {
    var gs = visibleGames();
    var groups = [['In progress', gs.filter(isLive)], ['Upcoming', gs.filter(function (g) { return !isLive(g) && !isFinal(g); })], ['Final', gs.filter(isFinal)]];
    list.innerHTML = groups.filter(function (x) { return x[1].length; }).map(function (x) {
      return '<section class="group"><h2>' + x[0] + '</h2>' + x[1].map(gameCard).join('') + '</section>';
    }).join('') || '<div class="empty">No games.</div>';
  }
  list.addEventListener('click', function (e) {
    var b = e.target.closest('button.game');
    if (b) select(b.dataset.pk);
  });

  function renderLeagues() {
    var seen = {}, prev = leagueSel.value;
    today.games.forEach(function (g) { seen[g.sport.id] = g.sport.name; });
    var ids = Object.keys(seen).map(Number).sort(function (a, b) { return a - b; });
    leagueSel.innerHTML = '<option value="">All leagues</option>' + ids.map(function (id) {
      return '<option value="' + id + '">' + esc(seen[id]) + '</option>';
    }).join('');
    if (seen[prev]) leagueSel.value = prev;
  }
  leagueSel.addEventListener('change', renderList);

  // ---- the selected game --------------------------------------------------
  function select(pk) {
    selected = pk;
    if (location.hash !== '#' + pk) history.replaceState(null, '', '#' + pk);
    renderList();
    renderStage();
    fetchDetail();
  }
  function setColours(g) {
    stage.style.setProperty('--away', accent(g.away.abbr));
    stage.style.setProperty('--home', accent(g.home.abbr));
  }

  function renderStage() {
    var g = games[selected];
    if (!g) { stage.innerHTML = '<div class="empty">Pick a game.</div>'; document.title = 'Live'; return; }
    setColours(g);
    document.title = g.away.abbr + ' @ ' + g.home.abbr + ' — Live';
    var d = detail[g.gamePk];
    var html = masthead(g, d);
    if (d) {
      html += linescore(g, d) + '<div class="panels">' + atBat(g, d) + pitchMix(g, d) + plays(g, d) + '</div>';
    } else if (isLive(g) && g.tracked === false) {
      html += '<p class="note">No pitch tracking at ' + esc(g.venue || 'this park') + ', so there is only a score to show.</p>';
    } else if (isLive(g)) {
      html += '<p class="note">Waiting for the first tracked pitches…</p>';
    } else if (isFinal(g) && g.tracked !== true) {
      html += '<p class="note">' + (g.tracked === false ? 'No pitch tracking at ' + esc(g.venue || 'this park') + '.' : 'This game finished before the live feed was being followed.') + '</p>';
    } else {
      html += '<p class="note">' + esc(g.status.detailed) + (g.status.abstract === 'Preview' ? ' · first pitch ' + clock(g.startTime) : '') + '</p>';
    }
    stage.innerHTML = html;
  }

  function masthead(g, d) {
    var live = isLive(g);
    var as = g.away.score == null ? '' : g.away.score, hs = g.home.score == null ? '' : g.home.score;
    if (d) { as = d.linescore.away && d.linescore.away.runs != null ? d.linescore.away.runs : as; hs = d.linescore.home && d.linescore.home.runs != null ? d.linescore.home.runs : hs; }
    var situ = '';
    if (live) {
      var s = situation(g, d);
      situ = '<span class="live">' + esc(s.where) + '</span>' + (s.outs != null ? '<span><b>' + s.outs + '</b> out' + (s.outs === 1 ? '' : 's') + '</span>' : '');
      if (d) situ += '<span>updated ' + hhmm(stampToIso(d.updated)) + '</span>';
    } else {
      situ = '<span>' + esc(isFinal(g) ? stateText(g) : g.status.detailed) + '</span>';
    }
    return '<header class="mast">'
      + '<div class="eyebrow"><span>' + esc(shortLeague(g)) + (g.league ? ' · ' + esc(g.league) : '') + '</span><span>' + esc(g.venue || '') + '</span><span>' + niceDate(g.date) + '</span></div>'
      + '<div class="score"><h1><span class="away">' + esc(g.away.name) + ' <em>' + as + '</em></span><span class="at">@</span><span class="home">' + esc(g.home.name) + ' <em>' + hs + '</em></span></h1></div>'
      + '<div class="situ">' + situ + '</div>'
      + '</header>';
  }
  function stampToIso(stamp) {   // 20260920_212119 (UTC) -> ISO
    if (!stamp || stamp.length < 15) return new Date().toISOString();
    return stamp.slice(0, 4) + '-' + stamp.slice(4, 6) + '-' + stamp.slice(6, 8) + 'T' + stamp.slice(9, 11) + ':' + stamp.slice(11, 13) + ':' + stamp.slice(13, 15) + 'Z';
  }

  // where we are: half-inning and outs, from the feed if we have it, else the schedule
  function situation(g, d) {
    var inn = d ? d.linescore.inning : g.inning, h = d ? d.linescore.half : g.half;
    var where = h && inn ? half(h) + ' ' + ordinal(inn) : g.status.detailed;
    var outs = null;
    if (d && (h === 'Top' || h === 'Bottom')) {
      var hp = d.pitches.filter(function (p) { return p.inning === inn && p.half === h.toLowerCase(); });
      outs = hp.length ? hp[hp.length - 1].outs : 0;
    } else if (h === 'Middle' || h === 'End') outs = null;
    return { where: where, outs: outs };
  }

  function linescore(g, d) {
    var ls = d.linescore, inns = ls.innings || [];
    var n = Math.max(9, inns.length);
    var head = '';
    for (var i = 1; i <= n; i++) head += '<th>' + i + '</th>';
    function row(side, cls) {
      var cells = '';
      for (var i = 1; i <= n; i++) {
        var inn = inns[i - 1], v = inn ? inn[side] : null;
        var cur = isLive(g) && ls.inning === i && ((side === 'away' && ls.half === 'Top') || (side === 'home' && ls.half === 'Bottom'));
        cells += '<td class="' + (v ? 'got' : '') + (cur ? ' cur' : '') + '">' + (v == null ? '' : v) + '</td>';
      }
      var r = ls[side] && ls[side].runs != null ? ls[side].runs : '';
      return '<tr class="team--' + cls + '"><th>' + esc(g[side].abbr || g[side].name) + '</th>' + cells + '<td class="tt">' + r + '</td></tr>';
    }
    return '<div class="linewrap"><table class="line"><thead><tr><th></th>' + head + '<th class="tt">R</th></tr></thead><tbody>'
      + row('away', 'away') + row('home', 'home') + '</tbody></table></div>';
  }

  function current(d) {   // the at-bat in progress, or the last one
    var plays = d.plays, play = plays[plays.length - 1];
    if (!play) return null;
    var seq = d.pitches.filter(function (p) { return p.atBat === play.atBat; });
    return { play: play, seq: seq, over: play.complete };
  }
  function name(d, id) { return d.players[id] || String(id); }

  function atBat(g, d) {
    var cur = current(d);
    if (!cur) return '<section class="panel"><h2>At bat</h2><div class="seq"><span class="none">No plays yet.</span></div></section>';
    var play = cur.play, seq = cur.seq, last = seq[seq.length - 1];
    var balls = last ? last.balls : 0, strikes = last ? last.strikes : 0;
    if (cur.over) { balls = 0; strikes = 0; }
    var sq = function (n, max, cls) { var s = ''; for (var i = 0; i < max; i++) s += '<i class="' + (i < n ? cls : '') + '"></i>'; return '<span class="sq">' + s + '</span>'; };
    var hand = function (p, k) { return p ? ' <i>(' + p[k] + 'HP)</i>' : ''; };
    var title = cur.over ? 'Last at-bat' : 'At bat';
    var who = '<div class="who"><span><b>' + esc(name(d, play.batter)) + '</b>' + (last ? ' <i>' + last.stand + 'HB</i>' : '') + '</span>'
      + '<span><i>vs</i> <b>' + esc(name(d, play.pitcher)) + '</b>' + (last ? ' <i>' + last.throws + 'HP</i>' : '') + '</span></div>';
    var count = cur.over
      ? '<div class="count"><span style="color:' + (EVENT_COLOUR[play.event] || '#e3e9f1') + ';font-weight:600">' + esc(eventName(play.event)) + '</span></div>'
      : '<div class="count"><span>Balls' + sq(balls, 3, 'b') + '</span><span>Strikes' + sq(strikes, 2, 's') + '</span></div>';
    return '<section class="panel"><h2>' + title + '<span>' + esc(half(play.half === 'top' ? 'Top' : 'Bottom')) + ' ' + ordinal(play.inning) + '</span></h2>'
      + '<div class="ab">' + who + count + zone(seq, last) + sequence(seq) + '</div></section>';
  }

  function zone(seq, last) {
    // catcher's view: x in feet (+ to the catcher's right), z in feet off the ground
    var W = 0.708, ZB = 1.5, ZT = 3.5;
    var s = '<svg class="zone" viewBox="-1.9 -0.15 3.8 4.9" aria-label="Pitch locations">';
    s += '<line class="grid" x1="' + (-W + 2 * W / 3) + '" y1="' + (5 - ZT) + '" x2="' + (-W + 2 * W / 3) + '" y2="' + (5 - ZB) + '"/>';
    s += '<line class="grid" x1="' + (W - 2 * W / 3) + '" y1="' + (5 - ZT) + '" x2="' + (W - 2 * W / 3) + '" y2="' + (5 - ZB) + '"/>';
    s += '<line class="grid" x1="' + -W + '" y1="' + (5 - (ZB + (ZT - ZB) / 3)) + '" x2="' + W + '" y2="' + (5 - (ZB + (ZT - ZB) / 3)) + '"/>';
    s += '<line class="grid" x1="' + -W + '" y1="' + (5 - (ZB + 2 * (ZT - ZB) / 3)) + '" x2="' + W + '" y2="' + (5 - (ZB + 2 * (ZT - ZB) / 3)) + '"/>';
    s += '<rect class="plate" x="' + -W + '" y="' + (5 - ZT) + '" width="' + (2 * W) + '" height="' + (ZT - ZB) + '"/>';
    s += '<path class="plate" d="M-0.708 4.62 L0.708 4.62 L0.708 4.7 L0 4.78 L-0.708 4.7 Z"/>';
    seq.forEach(function (p) {
      if (p.px == null || p.pz == null) return;
      var x = Math.max(-1.8, Math.min(1.8, p.px)), y = 5 - Math.max(0, Math.min(4.9, p.pz));
      s += '<circle class="fill-' + kind(p) + (p === last ? ' last' : '') + '" cx="' + x.toFixed(3) + '" cy="' + y.toFixed(3) + '" r="0.14"/>'
        + '<text x="' + x.toFixed(3) + '" y="' + y.toFixed(3) + '">' + p.n + '</text>';
    });
    return s + '</svg>';
  }

  function sequence(seq) {
    if (!seq.length) return '<div class="seq"><span class="none">No pitches yet.</span></div>';
    return '<div class="seq">' + seq.map(function (p, i) {
      var last = i === seq.length - 1, res = RESULT_NAME[p.description] || p.description;
      var ev = p.ev != null ? '<span class="ev">' + p.ev.toFixed(1) + ' mph · ' + p.la + '°</span>' : '';
      return '<div class="row' + (last ? ' last' : '') + '"><span class="n">' + p.n + '</span>'
        + '<span>' + esc(PITCH_NAME[p.type] || p.type || '—') + '</span>'
        + '<span>' + (p.velo != null ? p.velo.toFixed(1) : '') + '</span>'
        + '<span class="r"><i class="sw fill-' + kind(p) + '"></i><span>' + esc(res) + '</span>' + ev + '</span></div>';
    }).join('') + '</div>';
  }

  function pitchMix(g, d) {
    var cur = current(d);
    if (!cur) return '';
    var pid = cur.play.pitcher;
    var mine = d.pitches.filter(function (p) { return p.pitcher === pid && p.type; });
    var by = {};
    mine.forEach(function (p) {
      var t = by[p.type] || (by[p.type] = { n: 0, velo: [], max: 0, ivb: [], hb: [], spin: [], whiff: 0, swing: 0 });
      t.n++;
      if (p.velo != null) { t.velo.push(p.velo); t.max = Math.max(t.max, p.velo); }
      if (p.ivb != null) t.ivb.push(p.ivb);
      if (p.hb != null) t.hb.push(p.hb);
      if (p.spin != null) t.spin.push(p.spin);
      var k = kind(p);
      if (k === 'swing' || k === 'foul' || k === 'inplay') t.swing++;
      if (k === 'swing') t.whiff++;
    });
    var avg = function (a, f) { if (!a.length) return '<span class="dim">–</span>'; var v = a.reduce(function (x, y) { return x + y; }, 0) / a.length; return v.toFixed(f); };
    var types = Object.keys(by).sort(function (a, b) { return by[b].n - by[a].n; });
    var rows = types.map(function (t) {
      var x = by[t];
      return '<tr><td class="t">' + esc(PITCH_NAME[t] || t) + '</td><td>' + x.n + '</td><td>' + Math.round(100 * x.n / mine.length) + '%</td>'
        + '<td>' + avg(x.velo, 1) + '</td><td>' + (x.max ? x.max.toFixed(1) : '<span class="dim">–</span>') + '</td>'
        + '<td>' + avg(x.ivb, 1) + '</td><td>' + avg(x.hb, 1) + '</td><td>' + avg(x.spin, 0) + '</td>'
        + '<td>' + (x.swing ? Math.round(100 * x.whiff / x.swing) + '%' : '<span class="dim">–</span>') + '</td></tr>';
    }).join('');
    var strikes = mine.filter(function (p) { return kind(p) !== 'ball' && kind(p) !== 'hbp'; }).length;
    return '<section class="panel"><h2>' + esc(name(d, pid)) + '<span>' + mine.length + ' pitches · ' + strikes + ' strikes</span></h2>'
      + '<table class="mix"><thead><tr><th>Pitch</th><th>#</th><th>%</th><th>Velo</th><th>Max</th><th>IVB</th><th>HB</th><th>Spin</th><th>Whiff</th></tr></thead>'
      + '<tbody>' + rows + '</tbody></table></section>';
  }

  function plays(g, d) {
    var cur = current(d);
    var recent = d.plays.slice().reverse().slice(0, 14);
    return '<section class="panel wide"><h2>Plays<span>most recent first</span></h2><div class="plays">' + recent.map(function (p) {
      var now = cur && p.atBat === cur.play.atBat && !p.complete;
      var colour = p.complete ? (EVENT_COLOUR[p.event] || OUT_COLOUR) : 'var(--live)';
      return '<div class="play' + (now ? ' now' : '') + (p.rbi ? ' rbi' : '') + '" style="border-left-color:' + colour + '">'
        + '<span class="inn">' + (p.half === 'top' ? '▲' : '▼') + ' ' + p.inning + '</span>'
        + '<div class="what"><b>' + (p.complete ? esc(eventName(p.event)) : esc(name(d, p.batter)) + ' batting') + (p.rbi ? ' · ' + p.rbi + ' RBI' : '') + '</b>'
        + (p.description ? '<span>' + esc(p.description) + '</span>' : '') + '</div></div>';
    }).join('') + '</div></section>';
  }

  // ---- fetching -----------------------------------------------------------
  function fetchToday() {
    return fetch(DATA + '/live/today.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (t) {
        today = t; games = {};
        t.games.forEach(function (g) { games[g.gamePk] = g; });
        var live = t.games.filter(isLive).length, tracked = t.games.filter(function (g) { return isLive(g) && g.tracked; }).length;
        status.innerHTML = '<i class="dot' + (live ? ' on' : '') + '"></i>'
          + (live ? live + ' in progress' + (tracked !== live ? ', ' + tracked + ' tracked' : '') : t.games.length + ' games, none in progress')
          + ' · ' + hhmm(t.updated);
        renderLeagues(); renderList();
        if (selected && games[selected]) renderStage();
      });
  }
  var inflight = null;
  function fetchDetail() {
    var g = games[selected];
    if (!g || g.tracked !== true) return;               // nothing to fetch, or a 404 waiting to be cached
    var have = detail[g.gamePk];
    if (have && isFinal(g) && have.coded === 'F') return; // final and we hold the final version
    if (inflight === g.gamePk) return;
    inflight = g.gamePk;
    fetch(DATA + '/live/games/' + g.gamePk + '.json').then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { detail[g.gamePk] = d; if (String(selected) === String(g.gamePk)) renderStage(); })
      .catch(function () {})
      .then(function () { inflight = null; });
  }
  function tick() {
    fetchToday().then(fetchDetail).catch(function (e) {
      status.innerHTML = '<i class="dot"></i>Could not reach the live feed';
      if (!today) stage.innerHTML = '<div class="empty">The live feed is not reachable right now.</div>';
    });
  }
  function start() { stop(); tick(); timer = setInterval(tick, POLL_MS); }
  function stop() { if (timer) clearInterval(timer); timer = null; }
  document.addEventListener('visibilitychange', function () { if (document.hidden) stop(); else start(); });

  window.addEventListener('hashchange', function () {
    var pk = location.hash.replace('#', '');
    if (games[pk] && pk !== selected) select(pk);
  });

  fetchToday().then(function () {
    var pk = location.hash.replace('#', '');
    if (!games[pk]) {
      var gs = visibleGames();
      pk = gs.length ? gs[0].gamePk : null;   // first in-progress game, else the next up
    }
    if (pk) select(pk); else stage.innerHTML = '<div class="empty">No games today.</div>';
    timer = setInterval(tick, POLL_MS);
  }).catch(function () {
    status.innerHTML = '<i class="dot"></i>Could not reach the live feed';
    stage.innerHTML = '<div class="empty">The live feed is not reachable right now.</div>';
  });
})();
</script>
</body>
</html>
