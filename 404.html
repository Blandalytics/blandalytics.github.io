<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex">
<title>Page not found · Blandalytics</title>
<script>
  // GitHub Pages serves this page for any path the site doesn't have. One kind of path is a short
  // link, not a missing page: /game-sim/<gamePk> (and the older /lineup-sims/<gamePk>) is the Game
  // Sim with that 2026 game loaded (lineup-sims/game.js reads #gp=). It goes there before anything is drawn.
  (function () {
    var m = location.pathname.match(/^\/(?:game-sim|lineup-sims)\/(\d{6,7})\/?$/);
    if (m) location.replace("/game-sim/#gp=" + m[1]);
  })();
</script>
<style>
:root{--ground:#0d1117; --surface:#151b23; --ink:#e3e9f1; --muted:#8a96a6; --rule:#242c37; --accent:#6cb4ff}
*{box-sizing:border-box}
body{margin:0; min-height:100vh; background:var(--ground); color:var(--ink);
  font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:15px; line-height:1.45; padding:24px 16px}
main{max-width:640px; margin:0 auto}
h1{margin:6px 0 10px; font-size:30px; font-weight:700; letter-spacing:-.02em; line-height:1.1}
p{margin:0 0 8px; color:var(--muted); overflow-wrap:anywhere}
a{color:var(--accent)}
a.home{color:var(--muted); text-decoration:none; font-size:14px}
a.home:hover{color:var(--ink)}
code{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; font-size:13px; color:var(--ink)}
</style>
</head>
<body>
<main>
  <a class="home" href="/">← Blandalytics</a>
  <h1>Page not found</h1>
  <p>There's nothing at <code id="path"></code>.</p>
  <p><a href="/">Back to the home page</a></p>
</main>
<script>document.getElementById("path").textContent = location.pathname;</script>
</body>
</html>
